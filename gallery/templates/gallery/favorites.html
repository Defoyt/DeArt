{% extends 'gallery/base.html' %}
{% block content %}
<h2>Ваше избранное</h2>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    {% for photo in photos %}
        <div class="card" style="text-align: center;">
            <a href="{% url 'photo_detail' photo.pk %}">
                <img src="{{ photo.image.url }}" alt="{{ photo.title }}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px;">
            </a>
            <h3 style="margin: 10px 0 5px 0;">{{ photo.title }}</h3>
            <p style="font-size: 14px; color: #8d99ae;">Автор: {{ photo.author.username }}</p>
        </div>
    {% empty %}
        <p>В избранном пока ничего нет.</p>
    {% endfor %}
</div>
{% endblock %}
